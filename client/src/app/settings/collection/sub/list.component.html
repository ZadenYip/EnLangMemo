<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ "PAGES.SETTINGS.COLLECTION.CREATED.TITLE" | translate }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    @if (collections().length === 0) {
      <p class="empty">{{ "PAGES.SETTINGS.COLLECTION.CREATED.EMPTY" | translate }}</p>
    } @else {
      <mat-list>
        @for (collectionName of collections(); track collectionName) {
          <mat-list-item>
            <div matListItemTitle>{{ collectionName }}</div>
          </mat-list-item>
        }
      </mat-list>
    }
  </mat-card-content>
</mat-card>
