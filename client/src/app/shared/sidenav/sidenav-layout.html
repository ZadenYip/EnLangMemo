<mat-sidenav-container class="sidenav-container">
    <mat-sidenav mode="side" opened>
        <mat-nav-list>
            @for (route of getRoutes(); track $index) {
                <a mat-list-item routerLink="{{ route.path }}" routerLinkActive="active-link">{{ route.title | translate }}</a>
            }
        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
