<div class="toolbar-wrapper">
    <nav>
        <div class="toolbar-nav-buttons">
            @for (t of tabs; track t.path) {
                <a mat-button routerLink="{{ t.path }}" routerLinkActive="active">
                    {{ t.label | translate }}
                </a>
            }
            <a mat-button> {{ "HEADER.SYNC" | translate }}</a>
        </div>
        <button mat-button type="button" class="auth-status-button" [disabled]="auth.authBusy()" (click)="onAuthStatusClick()">
            @if (auth.currentUser(); as user) {
                {{ user.nickname }}
            } @else {
                {{ auth.authStatusLabel() | translate }}
            }
        </button>
    </nav>
</div>

<main class="main-content">
    <div class="router-outlet-wrapper">
        <router-outlet></router-outlet>
    </div>
    <app-dictionary></app-dictionary>
</main>
