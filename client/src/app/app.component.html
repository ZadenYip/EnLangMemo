<div class="toolbar-wrapper">
    <nav>
        <div class="toolbar-nav-buttons">
            @for (t of tabs; track t.path) {
                <a mat-button routerLink="{{ t.path }}" routerLinkActive="active">
                    {{ t.label | translate }}
                </a>
            }
            <a mat-button> {{ "HEADER.SYNC" | translate }}</a>
        </div>
        @if (auth.currentUser(); as user) {
            <button mat-button type="button" class="auth-status-button" [disabled]="auth.authBusy()" [matMenuTriggerFor]="authMenu">
                {{ user.nickname }}
            </button>
        } @else {
            <button mat-button type="button" class="auth-status-button" [disabled]="auth.authBusy()" (click)="onAuthStatusClick()">
                {{ auth.authStatusLabel() | translate }}
            </button>
        }
        <mat-menu #authMenu="matMenu">
            <button mat-menu-item type="button" (click)="onLogoutClick()">
                {{ "HEADER.AUTH.LOGOUT" | translate }}
            </button>
        </mat-menu>
    </nav>
</div>

<main class="main-content">
    <div class="router-outlet-wrapper">
        <router-outlet></router-outlet>
    </div>
    <app-dictionary></app-dictionary>
</main>
