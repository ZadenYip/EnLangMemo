<div class="deck-container">
  <div class="deck-header">
    <span>{{ "PAGES.HOME.DECKS.NAME" | translate }}</span>
    <span>今日已复习</span>
    <span>今日应复习</span>
    <span>今日可新学</span>
    <span>设置</span>
  </div>

    @for (deck of deckOverviewList; track deck.id) {
    <div class="deck-row">
      <a class="deck-link" href="" (click)="$event.preventDefault(); openDeckReview(deck)">
        {{ deck.name }}
      </a>
      <span>{{ deck.reviewedToday }}</span>
      <span>{{ deck.dueToday }}</span>
      <span>{{ deck.canLearnToday }}</span>
      <button type="button" mat-icon-button class="deck-settings-btn" aria-label="牌组设置"
        (click)="openDeckSettings(deck)">
        <mat-icon>settings</mat-icon>
      </button>
    </div>
    }

    <div class="create-deck-row">
      <!-- TODO  给 placeholder 改为 tranlsatepipe -->
      <input
        class="create-name-input"
        type="text"
        [value]="pendingDeckName"
        placeholder="点击添加牌组"
        (input)="onPendingDeckNameInput($event)"
      />
      <span class="create-placeholder">-</span>
      <span class="create-placeholder">-</span>
      <span class="create-placeholder">-</span>
      <div class="create-actions">
        <button type="button" mat-icon-button (click)="confirmCreateDeck()">
          <mat-icon>check</mat-icon>
        </button>
        <button type="button" mat-icon-button (click)="cancelCreateDeck()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
  </div>
