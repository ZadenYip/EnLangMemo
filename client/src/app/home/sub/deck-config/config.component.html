<h2 mat-dialog-title>
    {{ "PAGES.HOME.DECKS.CONFIG_DIALOG.TITLE" | translate:{ name: deckName } }}
</h2>
<mat-dialog-content>
    <mat-form-field appearance="outline">
        <mat-label>{{ "PAGES.HOME.DECKS.CONFIG_DIALOG.FIELDS.NEW_CARDS_PER_DAY" | translate }}</mat-label>
        <input matInput type="number" [(ngModel)]="settings.newCardsPerDay" min="-1"/>
        <mat-hint>{{ "PAGES.HOME.DECKS.CONFIG_DIALOG.FIELDS.NEW_CARDS_PER_DAY_HINT" | translate }}</mat-hint>
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button type="button" mat-flat-button (click)="onSave()">
        {{ "PAGES.HOME.DECKS.CONFIG_DIALOG.ACTIONS.SAVE" | translate }}
    </button>
    <button type="button" mat-button (click)="onCancel()">
        {{ "PAGES.HOME.DECKS.CONFIG_DIALOG.ACTIONS.CANCEL" | translate }}
    </button>
</mat-dialog-actions>
