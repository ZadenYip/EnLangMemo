<div class="template-operation-group">
    <app-select-dropdown
        [options]="opts"
        [selectedOption]="selected"
        (selectedOptionChange)="pickCardTpl($event)"
    ></app-select-dropdown>
    <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="onMenuAction('create')">
            <mat-icon>add</mat-icon>
            <span>{{ 'PAGES.PROCESSING.BENCH.TEMPLATE_EDIT.CARD_TPL_OPS_MENU.CREATE' | translate }}</span>
        </button>
    </mat-menu>
</div>
