<div class="header">
    <div class="template-operation-area">
        <!-- card template operations    -->
        <app-card-tpl-ops
            [opts]="cardTplOpts"
            [selected]="selCardTpl()"
            (selectedChange)="pickCardTpl($event)"
            (addClick)="addCardTpl()"
        ></app-card-tpl-ops>

        <!-- note template operations -->
        <app-note-tpl-ops
            [opts]="noteTplOpts"
            [selected]="selNoteTpl()"
            (selectedChange)="pickNoteTpl($event)"
            (addClick)="addNoteTpl()"
            (settingsClick)="openNoteTplSettings()"
        ></app-note-tpl-ops>
    </div>

    <mat-radio-group
        class="tabs"
        [value]="section()"
        (change)="setSection($any($event.value))"
    >
        <mat-radio-button class="tab" value="front">
            {{ "PAGES.PROCESSING.BENCH.NOTE_TEMPLATE.FRONT_TEMPLATE" | translate }}
        </mat-radio-button>
        <mat-radio-button class="tab" value="back">
            {{ "PAGES.PROCESSING.BENCH.NOTE_TEMPLATE.BACK_TEMPLATE" | translate }}
        </mat-radio-button>
        <mat-radio-button class="tab" value="css">
            {{ "PAGES.PROCESSING.BENCH.NOTE_TEMPLATE.CSS_TEMPLATE" | translate }}
        </mat-radio-button>
    </mat-radio-group>
</div>

<div class="editor">
    @switch (section()) {
        @case ("front") {
            <app-note-template-editor-textarea
                [value]="frontTpl()"
                [placeholder]="'PAGES.PROCESSING.BENCH.NOTE_TEMPLATE.FRONT_PLACEHOLDER' | translate"
                (valueChange)="frontTpl.set($event)"
            ></app-note-template-editor-textarea>
        }
        @case ("back") {
            <app-note-template-editor-textarea
                [value]="backTpl()"
                [placeholder]="'PAGES.PROCESSING.BENCH.NOTE_TEMPLATE.BACK_PLACEHOLDER' | translate"
                (valueChange)="backTpl.set($event)"
            ></app-note-template-editor-textarea>
        }
        @case ("css") {
            <app-note-template-editor-textarea
                [value]="cssTpl()"
                [placeholder]="'PAGES.PROCESSING.BENCH.NOTE_TEMPLATE.CSS_PLACEHOLDER' | translate"
                (valueChange)="cssTpl.set($event)"
            ></app-note-template-editor-textarea>
        }
    }
</div>
