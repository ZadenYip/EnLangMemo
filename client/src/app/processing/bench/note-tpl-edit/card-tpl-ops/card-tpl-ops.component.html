<div class="template-operation-group">
    <app-select-dropdown
        [options]="benchState.cardTplOptions()"
        [selectedOption]="benchState.selectedCardTpl()"
        [disabled]="benchState.isBusy()"
        (selectedOptionChange)="pickCardTpl($event)"
    ></app-select-dropdown>
    <button mat-icon-button [disabled]="benchState.isBusy()" [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
        <button mat-menu-item [disabled]="benchState.isBusy()" (click)="onMenuAction('create')">
            <mat-icon>add</mat-icon>
            <span>{{ 'PAGES.PROCESSING.BENCH.TEMPLATE_EDIT.CARD_TPL_OPS_MENU.CREATE' | translate }}</span>
        </button>
        <button mat-menu-item [disabled]="benchState.isBusy() || !benchState.selectedCardTpl().value" (click)="onMenuAction('delete')">
            <mat-icon>delete</mat-icon>
            <span>{{ 'PAGES.PROCESSING.BENCH.TEMPLATE_EDIT.CARD_TPL_OPS_MENU.DELETE' | translate }}</span>
        </button>
    </mat-menu>
</div>
